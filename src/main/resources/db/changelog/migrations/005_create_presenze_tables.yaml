databaseChangeLog:
  - changeSet:
      id: "005"
      author: nippon-manager
      changes:
        - createTable:
            tableName: lezioni
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: corso_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_lezioni_corso
                    references: corsi(id)
                    deleteCascade: true
              - column:
                  name: data
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: ora_inizio
                  type: TIME
              - column:
                  name: ora_fine
                  type: TIME
              - column:
                  name: sala
                  type: VARCHAR(150)
              - column:
                  name: annullata
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: note
                  type: TEXT

        - addUniqueConstraint:
            tableName: lezioni
            columnNames: corso_id, data, ora_inizio
            constraintName: uk_lezioni_corso_data_ora

        - createIndex:
            tableName: lezioni
            indexName: idx_lezioni_corso_data
            columns:
              - column:
                  name: corso_id
              - column:
                  name: data

        - createTable:
            tableName: presenze
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: lezione_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_presenze_lezione
                    references: lezioni(id)
                    deleteCascade: true
              - column:
                  name: atleta_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_presenze_atleta
                    references: atleti(id)
              - column:
                  name: stato
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: note
                  type: TEXT

        - addUniqueConstraint:
            tableName: presenze
            columnNames: lezione_id, atleta_id
            constraintName: uk_presenze_lezione_atleta

        - createIndex:
            tableName: presenze
            indexName: idx_presenze_atleta
            columns:
              - column:
                  name: atleta_id
